name: Update Goodreads Read List

on:
  schedule:
    # Run at 3 AM UTC every day (after Strava)
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  fetch_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      # Goodreads retired the shelf RSS feeds in late October 2026 (404 for
      # every user). The script now reads the public shelf widget and merges
      # it into _data/recently_read.yml; it retries on its own.
      - name: Fetch Goodreads Read List
        env:
          GOODREADS_USER_ID: ${{ secrets.GOODREADS_USER_ID }}
        run: ruby scripts/fetch_goodreads.rb

      - name: Validate feed data
        run: python3 .github/scripts/validate_feeds.py

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet _data/recently_read.yml || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/recently_read.yml
          git commit -m "chore: update recently read books from Goodreads"
          git push

      - name: Log failure to Issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `**Goodreads fetch failed** on ${date}\n\nWorkflow run: ${runUrl}\n\n<details><summary>Details</summary>\n\nThe Goodreads shelf-widget fetch or validation failed. Check the workflow logs for specifics.\n\n</details>`;

            const existing = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'feed-health'
            });

            const title = 'Feed health check failed';
            let issue;
            if (existing.data.length > 0) {
              issue = existing.data[0];
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body
              });
            } else {
              const created = await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: ['feed-health']
              });
              issue = created.data;
            }
            console.log(`Logged failure to issue #${issue.number}`);
