name: Update Strava Activities

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  fetch_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Fetch Strava Activities
        id: fetch
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: |
          ruby scripts/fetch_strava.rb

      - name: Retry fetch on failure
        if: failure() && steps.fetch.outcome == 'failure'
        run: |
          echo "Fetch failed — waiting 30 minutes before retry..."
          sleep 1800
          ruby scripts/fetch_strava.rb
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}

      - name: Validate feed data
        run: python3 .github/scripts/validate_feeds.py

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet _data/strava.yml _data/strava_stats.yml || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/strava.yml
          [ -f _data/strava_stats.yml ] && git add _data/strava_stats.yml || true
          git commit -m "chore: update recent Strava activities and stats"
          git push

      - name: Log failure to Issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `**Strava fetch failed** on ${date}\n\nWorkflow run: ${runUrl}\n\n<details><summary>Details</summary>\n\nThe Strava fetch or validation failed. Check the workflow logs for specifics.\n\n</details>`;

            const existing = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'feed-health'
            });

            const title = 'Feed health check failed';
            let issue;
            if (existing.data.length > 0) {
              issue = existing.data[0];
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body
              });
            } else {
              const created = await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: ['feed-health']
              });
              issue = created.data;
            }
            console.log(`Logged failure to issue #${issue.number}`);
